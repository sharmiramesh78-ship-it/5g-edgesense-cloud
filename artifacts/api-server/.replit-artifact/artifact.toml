kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["python", "-m", "compileall", "artifacts/edgesense-cloud/backend"]

[services.production.run]
args = ["python", "-m", "uvicorn", "backend.main:app", "--app-dir", "artifacts/edgesense-cloud", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"